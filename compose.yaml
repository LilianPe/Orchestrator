services:
  relais:
    build: .
    ports: ["4100:4100"]
    volumes:
      # Both must be writable by uid 1000 (user `node` in the image).
      - ./data:/data
      - ./repos:/repos
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?définissez ANTHROPIC_API_KEY}
      GH_TOKEN: ${GH_TOKEN:?définissez GH_TOKEN (push HTTPS et gh pr)}
      RELAIS_UI_PASSWORD: ${RELAIS_UI_PASSWORD:?définissez RELAIS_UI_PASSWORD (mot de passe de l'interface)}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Relais}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-relais@localhost}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Relais}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-relais@localhost}
    restart: unless-stopped
