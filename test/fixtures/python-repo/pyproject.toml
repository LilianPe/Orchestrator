[project]
name = "audit-export"
version = "0.1.0"
description = "The factory's Python fixture: a repository with no .factory/config.yml (ORC-172)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true

[tool.ruff]
src = ["src", "tests"]
