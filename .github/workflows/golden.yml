name: golden
# ORC-236: the 10 golden tickets (pilot/golden-tickets.yml), 3 passes each, on every change of prompt, of skill or
# of preset. On fake runners: no model, no network, no external effect (docs/tests.md, "Golden tickets").
# src/golden/golden-workflow.test.ts checks these paths.
on:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'src/core/prompt.ts'
      - 'src/presets/**'
      - 'src/knowledge/**'
      - 'pilot/**'
      - 'src/golden/**'
      - 'test/golden/**'
      - '.github/workflows/golden.yml'
  pull_request:
    paths:
      - 'packs/**'
      - 'src/core/prompt.ts'
      - 'src/presets/**'
      - 'src/knowledge/**'
      - 'pilot/**'
      - 'src/golden/**'
      - 'test/golden/**'
      - '.github/workflows/golden.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOLDEN_REPORT: golden-report.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:golden
      # The report, ticket by ticket and pass by pass, with the tickets that changed, in the run's summary.
      - if: always()
        run: if [ -f "$GOLDEN_REPORT" ]; then cat "$GOLDEN_REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
