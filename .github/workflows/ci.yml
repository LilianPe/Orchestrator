name: ci
on:
  push: { branches: [main] }
  pull_request:
  # ORC-218: a runc, crun, Podman or kernel bump on the runner image is not announced. A weekly run
  # catches it, a manual one follows a bump of anything the sandbox stands on (docs/tests.md).
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
# Read rights alone, and no secret in this file (ORC-475): every PR runs it, the factory's included, and `factory doctor`
# refuses a workflow that hands those a secret or a writable token. What needs a secret is in main-secrets.yml, on main only.
permissions: { contents: read }
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The job takes 1.5 to 2 min (`npm test` 37 to 52 s); a stalled runner has taken 5.5 min for setup-node alone (ORC-290).
    # 15 min holds both, where GitHub's default of 6 h would hold a hung test that long (ORC-325).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The replay oracle (ORC-174), through the CLI: every journal of test/replay/journals gives back its decisions bit for bit.
      - run: npm run test:replay

  properties:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 1 to 2 min (ORC-377, runs of 11 and 12/11); 15 hold a stalled setup-node (ORC-290) and a first property past its
    # 200 s, which prints the seed that replays it (ORC-368).
    timeout-minutes: 15
    env:
      NUM_RUNS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:properties

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 2 to 4.5 min (ORC-377); a frozen Postgres would otherwise hold it 60 s a hook for up to 6 h.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:integration

  # ORC-163: a real daemon killed with SIGKILL at random moments over 500 events, on Postgres
  # (docs/tests.md). Its own job: about a minute and a half, in parallel with the others.
  chaos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 2.5 to 4.5 min (ORC-377), but its test has 30 min, and only its failure names the seed that replays it.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
      CHAOS_EVENTS: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:chaos

  isolation:
    runs-on: ubuntu-latest
    # 8.5 to 13 min, 9 most often (ORC-377). A wedged engine held it until someone cancelled it after 55 min, and runs
    # stuck in a `find /` went to GitHub's 6 h (ORC-372): 25 min is about twice the slowest run seen.
    timeout-minutes: 25
    env:
      FACTORY_ISOLATION: "1"
      # The gitleaks of docker/runner.Dockerfile, which takes the archive from its build context when it is there (ORC-369).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # Downloaded once, not on every run: GitHub's releases have answered 504 (ORC-369). Saved as soon as it is
      # checked, not at the end of a job a red test would keep from saving.
      - id: gitleaks
        uses: actions/cache/restore@v4
        with:
          path: docker/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Download gitleaks
        if: steps.gitleaks.outputs.cache-hit != 'true'
        run: |
          f="docker/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            || { echo "::error::downloading gitleaks ${GITLEAKS_VERSION} from GitHub's releases failed, retries included"; exit 1; }
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
      - if: steps.gitleaks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docker/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: ${{ steps.gitleaks.outputs.cache-primary-key }}
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          # A systemd user session: Podman's cgroup manager is then systemd, and the user's cgroup gets the
          # pids, memory and cpu controllers the sandboxes' limits need (isolation n° 9).
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          [ -S "/run/user/$(id -u)/bus" ] || { echo "::error::no user D-Bus socket at /run/user/$(id -u)/bus after 30 s: the systemd user session did not start, the sandboxes' limits need it"; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          podman system migrate
          podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupManager}} {{.Host.CgroupControllers}}'
      - run: npm ci
      # The image itself (ORC-203): built under the rootless engine, its tools checked and its layers scanned.
      # The other isolation tests stay on the public node image.
      - name: Check the runner image
        run: |
          podman build -f docker/runner.Dockerfile -t localhost/factory-runner:ci docker
          npx vitest run --project isolation test/isolation/runner-image.test.ts test/isolation/isolation-07-secrets.test.ts test/isolation/isolation-07-layers.test.ts test/isolation/claude-token.test.ts
        env:
          FACTORY_RUNNER_IMAGE: localhost/factory-runner:ci
      # The capture image of the visual proof (ORC-404), on top of the runner's: its captures at network none, the checkout alone mounted.
      - name: Check the capture image
        run: |
          podman build -f docker/browser.Dockerfile --build-arg RUNNER_IMAGE=localhost/factory-runner:ci -t localhost/factory-browser:ci docker
          podman image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'factory-(runner|browser):ci'
          npx vitest run --project isolation test/isolation/visual-proof.test.ts
        env:
          FACTORY_RUNNER_IMAGE: localhost/factory-runner:ci
          FACTORY_BROWSER_IMAGE: localhost/factory-browser:ci
      # Without a Claude login, isolation n° 11 skips itself here: the isolation-claude job of main-secrets.yml runs it (ORC-475).
      - run: npm run test:isolation
      # The engine's state when the job fails or times out, so a wedge comes with its evidence (ORC-377). A wedged
      # engine does not answer either: each command is bounded, and the processes are listed without asking it. A
      # cancel has killed the tests' own podman clients by then: what is left is the engine's side.
      - name: Container engine state
        if: failure() || cancelled()
        timeout-minutes: 4
        run: |
          ps -o pid,ppid,etime,stat,args -p "$(pgrep -d, -f 'podman|conmon|crun|runc|catatonit|fuse-overlayfs|slirp4netns|pasta|rootlessport|netavark|aardvark')" || true
          timeout -k 10 60 podman ps -a || echo "::warning::podman ps -a failed or did not answer within 60 s"
          timeout -k 10 60 podman info || echo "::warning::podman info failed or did not answer within 60 s"
