name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The replay oracle (ORC-174), through the CLI: every journal of test/replay/journals gives back its decisions bit for bit.
      - run: npm run test:replay

  properties:
    runs-on: ubuntu-latest
    env:
      NUM_RUNS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:properties

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:integration

  isolation:
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp/podman-runtime
      FACTORY_ISOLATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          podman system migrate
          podman info --format '{{.Host.Security.Rootless}}'
      - run: npm ci
      - run: npm run test:isolation
