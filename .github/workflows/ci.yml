name: ci
on:
  push: { branches: [main] }
  pull_request:
  # ORC-218: a runc, crun, Podman or kernel bump on the runner image is not announced. A weekly run
  # catches it, a manual one follows a bump of anything the sandbox stands on (docs/tests.md).
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The replay oracle (ORC-174), through the CLI: every journal of test/replay/journals gives back its decisions bit for bit.
      - run: npm run test:replay

  properties:
    runs-on: ubuntu-latest
    env:
      NUM_RUNS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:properties

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:integration

  # ORC-163: a real daemon killed with SIGKILL at random moments over 500 events, on Postgres
  # (docs/tests.md). Its own job: about a minute and a half, in parallel with the others.
  chaos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
      CHAOS_EVENTS: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:chaos

  isolation:
    runs-on: ubuntu-latest
    env:
      FACTORY_ISOLATION: "1"
      # Isolation n° 11 runs a real claude -p when this secret is set, and is skipped without it (forks too).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          # A systemd user session: Podman's cgroup manager is then systemd, and the user's cgroup gets the
          # pids, memory and cpu controllers the sandboxes' limits need (isolation n° 9).
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          podman system migrate
          podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupManager}} {{.Host.CgroupControllers}}'
      - run: npm ci
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - run: npm run test:isolation
