name: ci
on:
  push: { branches: [main] }
  pull_request:
  # ORC-218: a runc, crun, Podman or kernel bump on the runner image is not announced. A weekly run
  # catches it, a manual one follows a bump of anything the sandbox stands on (docs/tests.md).
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The job takes 1.5 to 2 min (`npm test` 37 to 52 s); a stalled runner has taken 5.5 min for setup-node alone (ORC-290).
    # 15 min holds both, where GitHub's default of 6 h would hold a hung test that long (ORC-325).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The replay oracle (ORC-174), through the CLI: every journal of test/replay/journals gives back its decisions bit for bit.
      - run: npm run test:replay

  properties:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      NUM_RUNS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:properties

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:integration

  # ORC-163: a real daemon killed with SIGKILL at random moments over 500 events, on Postgres
  # (docs/tests.md). Its own job: about a minute and a half, in parallel with the others.
  chaos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@127.0.0.1:5432/factory_test
      CHAOS_EVENTS: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:chaos

  isolation:
    runs-on: ubuntu-latest
    env:
      FACTORY_ISOLATION: "1"
      # Whether the secret is set, not the secret: only the step that runs the tests gets it.
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # The gitleaks of docker/runner.Dockerfile, which takes the archive from its build context when it is there (ORC-369).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # Downloaded once, not on every run: GitHub's releases have answered 504 (ORC-369). Saved as soon as it is
      # checked, not at the end of a job a red test would keep from saving.
      - id: gitleaks
        uses: actions/cache/restore@v4
        with:
          path: docker/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Download gitleaks
        if: steps.gitleaks.outputs.cache-hit != 'true'
        run: |
          f="docker/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            || { echo "::error::downloading gitleaks ${GITLEAKS_VERSION} from GitHub's releases failed, retries included"; exit 1; }
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
      - if: steps.gitleaks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docker/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: ${{ steps.gitleaks.outputs.cache-primary-key }}
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          # A systemd user session: Podman's cgroup manager is then systemd, and the user's cgroup gets the
          # pids, memory and cpu controllers the sandboxes' limits need (isolation n° 9).
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          [ -S "/run/user/$(id -u)/bus" ] || { echo "::error::no user D-Bus socket at /run/user/$(id -u)/bus after 30 s: the systemd user session did not start, the sandboxes' limits need it"; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          podman system migrate
          podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupManager}} {{.Host.CgroupControllers}}'
      - run: npm ci
      # Pinned, as docker/runner.Dockerfile: a claude bump is a change of its own.
      - if: env.HAS_CLAUDE_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      # The image itself (ORC-203): built under the rootless engine, its tools checked and its layers scanned.
      # The other isolation tests stay on the public node image.
      - name: Check the runner image
        run: |
          podman build -f docker/runner.Dockerfile -t localhost/factory-runner:ci docker
          npx vitest run --project isolation test/isolation/runner-image.test.ts test/isolation/isolation-07-secrets.test.ts test/isolation/isolation-07-layers.test.ts test/isolation/claude-token.test.ts
        env:
          FACTORY_RUNNER_IMAGE: localhost/factory-runner:ci
      # Isolation n° 11 runs a real claude -p when this secret is set, and is skipped without it (forks too).
      - run: npm run test:isolation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Isolation n° 12 and 13 (ORC-219) on the real GitHub, with a test App and its test repositories: no engine, so a job of
  # its own, skipped by `isolation`, and not started while the App's id is unset. The App's key is a secret of the environment
  # `isolation-github`, whose deployment branches are main alone: a branch that edits this file cannot read it (ORC-135).
  isolation-github:
    if: github.ref == 'refs/heads/main' && vars.FACTORY_ISO_GH_APP_ID != ''
    runs-on: ubuntu-latest
    environment: isolation-github
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run --project isolation test/isolation/isolation-12-ci-secrets.test.ts test/isolation/isolation-13-run-token.test.ts
        env:
          FACTORY_ISO_GH_APP_ID: ${{ vars.FACTORY_ISO_GH_APP_ID }}
          FACTORY_ISO_GH_APP_KEY: ${{ secrets.FACTORY_ISO_GH_APP_KEY }}
          FACTORY_ISO_GH_REPO: ${{ vars.FACTORY_ISO_GH_REPO }}
          FACTORY_ISO_GH_OTHER_REPO: ${{ vars.FACTORY_ISO_GH_OTHER_REPO }}
