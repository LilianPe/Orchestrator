name: main-secrets
# The tests that need a secret (ORC-475), out of ci.yml, which every PR runs: never on a pull request, so no branch, the
# factory's included, gets a secret by editing a workflow or a test, and `factory doctor` accepts the repository. They run
# on every push to main, the Monday run that catches a bump of the runner image (ORC-218), and by hand (docs/tests.md).
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  # Isolation n° 11 (ORC-205): a real claude -p on a trapped repository. Not started on a manual run of another branch,
  # whose code would get the login.
  isolation-claude:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm ci, claude's install and a claude -p bounded at 2 min: 15 min holds a stalled setup-node (ORC-290).
    timeout-minutes: 15
    env:
      # Whether the secret is set, not the secret: only the step that runs the test gets it.
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Pinned, as docker/runner.Dockerfile: a claude bump is a change of its own.
      - if: env.HAS_CLAUDE_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      # claude runs on the runner itself: the engine only pulls the images of the isolation suite's setup, the runner's
      # Docker rather than ci.yml's rootless Podman. Skipped without the secret.
      - run: npx vitest run --project isolation test/isolation/claude-settings.test.ts
        env:
          FACTORY_ISOLATION: "1"
          FACTORY_CONTAINER_CLI: docker
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Isolation n° 12 and 13 (ORC-219) on the real GitHub, with a test App and its test repositories: no engine, and not
  # started while the App's id is unset. The App's key is a secret of the environment `isolation-github`, whose deployment
  # branches are main alone: a branch that edits this file cannot read it (ORC-135).
  isolation-github:
    if: github.ref == 'refs/heads/main' && vars.FACTORY_ISO_GH_APP_ID != ''
    runs-on: ubuntu-latest
    environment: isolation-github
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run --project isolation test/isolation/isolation-12-ci-secrets.test.ts test/isolation/isolation-13-run-token.test.ts
        env:
          FACTORY_ISO_GH_APP_ID: ${{ vars.FACTORY_ISO_GH_APP_ID }}
          FACTORY_ISO_GH_APP_KEY: ${{ secrets.FACTORY_ISO_GH_APP_KEY }}
          FACTORY_ISO_GH_REPO: ${{ vars.FACTORY_ISO_GH_REPO }}
          FACTORY_ISO_GH_OTHER_REPO: ${{ vars.FACTORY_ISO_GH_OTHER_REPO }}
