version: 1
tracker:
  kind: linear
  pickup:
    checks: [has_description, not_started]
states:
  todo: "Todo"
  dev: "In Progress"
  human_review: "Human Review"
  ai_review: "AI Review"
  done: "Done"
limits:
  parallel_sessions: 3
  question_sessions: 2
  per_run: { turns: 150, duration: 90m, usd: 5 }
workspace:
  setup: []
  ports: { base: 4200 }
on:
  ticket.delegated:
    - { when: "state in [todo, dev] && !blocked", run: dev }
  status.changed:
    - { from: human_review, to: dev, run: dev-feedback }
    # The review starts once `dev` is published (its `on_success`). A human's move to AI Review reviews the published commit
    # again: how a commit published by `dev-feedback` gets a review, until ORC-184 chains it after every fix.
    - { to: ai_review, run: review }
  session.prompted:
    - { when: "blocked", run: dev-feedback, debounce: 0s }
    - { when: "state in [dev, human_review]", run: dev-feedback, debounce: 3m }
  # A reply to the blocking comment, written on the ticket. `dev-feedback` stands for a block with no step of its own (ORC-196).
  ticket.commented:
    - { when: "blocked", run: dev-feedback }
  session.mentioned:
    - { run: ask }
  command:
    - { say: retiens, run: remember }
    - { say: "fais-le", do: propose_delegate }
  label.changed:
    - { label: "agent:stop", do: stop }
  session.stopped:
    - { do: stop }
  pr.checks_failed:
    - { when: "state in [human_review, ai_review] && !blocked", run: fix-ci }
  pr.merged:
    - { move: done, do: cleanup, run: learn }
jobs:
  # The `intake` step of factory/default (ORC-206): reads the ticket and the code, returns size, risk, completeness and
  # screen through `submit_result`. Its end is the guard before In Progress: a complete ticket starts `dev`, an
  # incomplete one is blocked with its questions. Off until a rule runs it (`ticket.delegated: run: intake`).
  intake:
    step: intake
    queue: dev
    model: sonnet
    workspace: worktree
    session: new
    skill: "factory:intake"
    structured_output: true
    on_success: { run: dev }
  dev:
    # The agent step of factory/default this job runs: its effort, its ceiling of turns (ORC-136).
    step: build
    queue: dev
    model: sonnet
    workspace: worktree
    session: new
    skill: "factory:dev"
    pickup: true
    # No valid `submit_result`, no success. The build only, until ORC-191 rewrites the other skills.
    structured_output: true
    verify: []
    # The repository's commands and the checks of the diff, in a fresh clone (ORC-151): every job that writes code.
    repo_checks: true
    on_start: { move: dev }
    # Published, then the AI review (ORC-183), whose end shows the PR in Human Review.
    on_success: { move: ai_review, post: summary, run: review }
  # The `tests` step of factory/default (ORC-123): tests of the acceptance criteria only, then the `red`
  # check, then `dev`. Off until a rule runs it (`ticket.delegated: run: tests`); `red.mode: blocking`
  # once the golden tickets validate it.
  tests:
    extends: dev
    step: tests
    structured_output: false
    skill: "factory:tests"
    # The implementer's: the ticket session starts here, a return to the step and `dev` resume it (ORC-217).
    session: resume
    pickup: false
    red: { command: "npm test --", mode: measure }
    on_success: { run: dev }
  dev-feedback:
    extends: dev
    step: fix
    structured_output: false
    session: resume
    skill: "factory:feedback"
    input: feedback
    pickup: false
    on_start: {}
    on_success: { post: reply }
  fix-ci:
    extends: dev-feedback
    skill: "factory:fix-ci"
    input: ci_failures
  # The `review` step of factory/default (ORC-183): two read-only lenses on Opus, each in a fresh session, on a fresh clone
  # of the published commit, with the Read, Grep and Glob tools only, at network claude-api. Each hands back its findings
  # through `submit_result`; the second publishes both, as a GitHub review and the `factory/review` check.
  review:
    step: review
    queue: dev
    model: opus
    workspace: published
    session: new
    skill: "factory:review"
    lens: correctness
    # The published commit's diff, read by the factory: whatever relaunched the lens, it reads that alone.
    input: diff
    structured_output: true
    on_success: { run: review-security }
  review-security:
    extends: review
    lens: security
    on_success: { move: human_review, post: review }
  ask:
    queue: questions
    model: sonnet
    workspace: trunk-readonly
    session: new
    skill: "factory:ask"
    input: thread
    limits: { turns: 30, duration: 5m, usd: 0.5 }
    on_success: { post: reply }
  learn:
    queue: questions
    model: haiku
    workspace: knowledge
    session: new
    skill: "factory:learn"
    limits: { turns: 40, duration: 10m, usd: 0.5 }
    on_success: {}
  remember:
    extends: learn
    input: thread
    on_success: { post: reply }
