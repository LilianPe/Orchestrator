version: 1
tracker:
  kind: linear
  pickup:
    checks: [has_description, not_started]
states:
  todo: "Todo"
  dev: "In Progress"
  human_review: "Human Review"
  ai_review: "AI Review"
  done: "Done"
limits:
  parallel_sessions: 3
  question_sessions: 2
  per_run: { turns: 150, duration: 90m }
workspace:
  setup: []
  ports: { base: 4200 }
on:
  ticket.delegated:
    - { when: "state in [todo, dev] && !blocked", run: dev }
  status.changed:
    # The review starts once `dev`, `fix-ci`, `fix-review` or `fix-human` is published (their `on_success`). A human's move to
    # AI Review reviews the published commit again: how a commit `dev-feedback` publishes gets one.
    - { to: ai_review, run: review }
  # A reply in the ticket's session; a review written on the PR (`pr.reviewed`) goes through these rules too (ORC-190).
  # In Human Review, it is a round of human feedback: `fix-human`, on its own counter (`limits.human_review_rounds`).
  session.prompted:
    - { when: "blocked", run: dev-feedback, debounce: 0s }
    - { when: "state in [human_review]", run: fix-human, debounce: 3m }
    - { when: "state in [dev]", run: dev-feedback, debounce: 3m }
  # A reply to the blocking comment, written on the ticket. `dev-feedback` stands for a block with no step of its own (ORC-196).
  ticket.commented:
    - { when: "blocked", run: dev-feedback }
  # A mention asks a question. The memory in writing sleeps (ORC-193): no `retiens` command, a `retiens` is a message as any other.
  session.mentioned:
    - { run: ask }
  label.changed:
    - { label: "agent:stop", do: stop }
  session.stopped:
    - { do: stop }
  # Red CI, merge gate included: `fix-ci`, one round of the review and CI loop (limits.ci_fix_attempts, ORC-184).
  pr.checks_failed:
    - { when: "state in [human_review, ai_review] && !blocked", run: fix-ci }
  # A conflict of the PR with the default branch (ORC-146): the engine starts the rebase step, on the counter of red CI.
  # During another step, the rebase waits for that work to end: the agent at work never resolves the conflict.
  pr.conflicted:
    - { when: "state in [dev, human_review, ai_review] && !blocked", run: rebase }
  # The `after_merge` step (ORC-197): the requester mentioned in the ticket's session with the merged PR's link, the changelog
  # entry with the captures `verify` took, then the cleanup. It starts no run: the memory in writing sleeps (ORC-193).
  pr.merged:
    - { move: done, do: after_merge }
jobs:
  # The `intake` step of factory/default (ORC-206): reads the ticket and the code, returns size, risk, completeness and
  # screen through `submit_result`. Its end is the guard before In Progress: a complete ticket starts `dev`, an
  # incomplete one is blocked with its questions. Off until a rule runs it (`ticket.delegated: run: intake`).
  # On a fresh clone of the trunk, gone with its run, with the Read, Grep and Glob tools only, as the step writes nothing
  # (ORC-367): a ticket that does not start keeps no worktree.
  intake:
    step: intake
    queue: dev
    model: sonnet
    workspace: trunk-readonly
    session: new
    skill: "factory:intake"
    structured_output: true
    on_success: { run: dev }
  dev:
    # The agent step of factory/default this job runs: its effort, its ceiling of turns (ORC-136).
    step: build
    queue: dev
    model: sonnet
    workspace: worktree
    session: new
    skill: "factory:dev"
    pickup: true
    # No valid `submit_result`, no success. The build only, until ORC-191 rewrites the other skills.
    structured_output: true
    verify: []
    # The repository's commands and the checks of the diff, in a fresh clone (ORC-151): every job that writes code.
    repo_checks: true
    on_start: { move: dev }
    # Published, then the AI review (ORC-183), whose end shows the PR in Human Review.
    on_success: { move: ai_review, post: summary, run: review }
  # The `spec_draft` step of factory/default (ORC-212): writes the spec through `submit_result`, nothing in the
  # worktree. Its end is `spec_check`, then the spec is published and waits for a validator's `/approve`
  # (`spec_review`), which starts `tests`. Off until a rule runs it (intake's `on_success: { run: spec }`).
  spec:
    step: spec_draft
    queue: dev
    model: sonnet
    workspace: worktree
    session: new
    skill: "factory:spec"
    structured_output: true
    on_success: { run: tests }
  # The `tests` step of factory/default (ORC-123): tests of the acceptance criteria only, then the `red`
  # check, then `dev`. Off until a rule runs it (`ticket.delegated: run: tests`); `red.mode: blocking`
  # once the golden tickets validate it.
  tests:
    extends: dev
    step: tests
    structured_output: false
    skill: "factory:tests"
    # The implementer's: the ticket session starts here, a return to the step and `dev` resume it (ORC-217).
    session: resume
    pickup: false
    red: { command: "npm test --", mode: measure }
    on_success: { run: dev }
  dev-feedback:
    extends: dev
    step: fix
    structured_output: false
    session: resume
    skill: "factory:feedback"
    input: feedback
    pickup: false
    on_start: {}
    on_success: { post: reply }
  # The fix of a red CI goes back through `verify`, `publish` and the AI review, as any fix of the loop (ORC-184).
  fix-ci:
    extends: dev-feedback
    skill: "factory:fix-ci"
    input: ci_failures
    on_success: { move: ai_review, post: reply, run: review }
  # The fix of the review loop (ORC-184): the ticket's session in its worktree, on the blocking findings of the last review
  # and the PR's unresolved threads; one commit per finding fixed, or the finding contested with a justification
  # (`submit_result`'s `fixed` and `contested`). Then `verify`, `publish` and the AI review again.
  fix-review:
    extends: dev-feedback
    input: findings
    structured_output: true
    on_success: { move: ai_review, post: reply, run: review }
  # The fix of human review feedback (ORC-190): the ticket's session in its worktree, on the feedback written in Human Review
  # (the session's replies, the PR's reviews and unresolved threads). Then `verify`, `publish`, the AI review and Human Review
  # again. Each start is a round of the preset's `human_review` (3), apart from the review and CI loop; past it, blocked.
  fix-human:
    extends: dev-feedback
    counter: human_review
    on_success: { move: ai_review, post: reply, run: review }
  # The `rebase` step of factory/default (ORC-146): rebases the ticket's branch on the default branch in its sandbox, or
  # stops on the three conflicts a human decides (`submit_result` with `reason: conflict`). Its commit goes through `verify`,
  # then the factory publishes it over the head it published itself. It moves nothing and posts nothing.
  rebase:
    extends: dev
    step: rebase
    session: resume
    skill: "factory:rebase"
    pickup: false
    on_start: {}
    on_success: {}
  # The `review` step of factory/default (ORC-183): two read-only lenses on Opus, each in a fresh session, on a fresh clone
  # of the published commit, with the Read, Grep and Glob tools only, at network claude-api. Each hands back its findings
  # through `submit_result`; the second publishes both, as a GitHub review and the `factory/review` check.
  review:
    step: review
    queue: dev
    model: opus
    workspace: published
    session: new
    skill: "factory:review"
    lens: correctness
    structured_output: true
    on_success: { run: review-security }
  # A blocking finding on the commit starts `fix-review` instead of the move, one round of the review and CI loop (ORC-184).
  review-security:
    extends: review
    lens: security
    on_success: { move: human_review, post: review }
    on_blocking: { run: fix-review }
  ask:
    queue: questions
    model: sonnet
    workspace: trunk-readonly
    session: new
    skill: "factory:ask"
    input: thread
    limits: { turns: 30, duration: 5m }
    on_success: { post: reply }
